<html>
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width,intial-scale=1.0">
        <title>aurum jewellery</title>
        <link rel="stylesheet" href="style.css">
        
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #fffaf2;
            color:#33251b;
        }
        /*navbar*/
        header{
            background-color: #29231d;
            color:#d8b66a;
            padding:20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav{
            display:flex;
            gap:20px;
        }
        nav a:hover{
            color:#e4c47d;
        }
        .hero{
            min-height:320px;
            background:linear-gradient(rgba(0,0,0,0.35),rgba(0,0,0,0.35)
            ),
            url(rings.jpg);
            background-size: cover;
            background-position: center;
            color: white;
            display:flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px 15px;
            gap: 15px;
        }
        .hero h1{
            font-size: 36px;
        }
        .bnt{
            background-color: darkgoldenrod;
            color:#29231d;
            padding: 12px 25px;
            text-decoration: none;
            border-radius:4px;
        }
        #collection h2,.about h2{
            margin-bottom: 25px;
        }
        .product{
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }
        .card{
            width:220px;
            background-color: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow:0 2px 10px #00000012;
        }
        .card img{
            width:100%;
            height:200px;
            object-fit:cover;
            border-radius: 5px;
        }
        .card h3{
            padding:12px 0;
        }
        .about{
            text-align:center;
            padding: 35px 15px;
            background-color: #e9dcea;
        }
        footer{
            background-color: #29231d;
            color:white;
            text-align: center;
            padding: 20px;
            line-height:2;
        }
        @media(max-width:600px){
            header{
                flex-direction: column;
                gap: 15px;
            }
            nav{
                    gap: 12px;
                    flex-wrap: wrap;
                    justify-content: center;
                }
                .hero h1{
                    font-size: 28px;
                }
                .card{
                    width:100%;
                    max-width: 300px;
                }
            }
            header h2{
                font-family:Georgia, 'Times New Roman', Times, serif;
            }
            .kash{
                display:flex;
                flex-direction: row;
                justify-content:center;
                gap:25px;
                flex-wrap:nowrap;

            }
            .hero button{
                 color:brown;
            border-radius: 12px;
            }
        

    </style>
    </head>
    <body>
        
        <header>
            <h2>AURUM</h2>
            <nav>    
                <a href="index.html">HOME</a>
                <a href="collection.html">COLLECTION</a>
                <a href="about.html.html">ABOUT</a>
                <a href="contact.html">CONTACT</a>
            </nav>
        </header>
        <section class="hero">
            <h1>Beauty in Every Detail</h1>
            <p>Descover jewellery that shines with you</p>
            <button><a href="order.html">shop now</a></button>
        </section>
        <section id="collection">
            <h2>Our collection</h2>
            <div class="kash">
                <div class="card">
                    <img src="photo.png">
                    <h3>necklaces</h3>
                </div>
                <div class="card">
                    <img src="earings.png">
                    <h3>earings</h3>
                </div>
                <div class="card">
                    <img src="rings.png">
                    <h3>rings</h3>
                </div>
            </div>
        </section>
        <section id="about" class="about">
            <h2>about us</h2>
            <p>elegent desings for every special moment</p>
        </section>
        <footer id="contact">
            <p>contact:hello@aurum.com</p>
            <p>2026 aurum jewellery</p>
        </footer>
    </body>
</html>
